name: Fix AI Builder review render

on:
  push:
    paths:
      - .github/workflows/fix-ai-builder-review-render.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch review-required workspace rendering
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/components/ai-builder/AiBuilderClient.tsx')
          text = path.read_text()
          old = '    () => (session?.status === "ready" ? buildKnowledgePack(session) : null),'
          new = '    () => (session ? buildKnowledgePack(session) : null),'
          if old not in text:
              raise SystemExit('Expected knowledgePack render gate was not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/fix-ai-builder-review-render.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/components/ai-builder/AiBuilderClient.tsx
          git commit -m "[skip ci] Render AI Builder review-stage projects"
          git push origin main
