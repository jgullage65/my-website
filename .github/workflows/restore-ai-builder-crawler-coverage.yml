name: Restore AI Builder crawler coverage

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/restore-ai-builder-crawler-coverage.yml"

permissions:
  contents: write

jobs:
  restore-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore large-site crawl budget
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/lib/ai-engine/crawler/crawlBusinessWebsite.ts")
          content = path.read_text()
          broken = "const MAX_PAGES = PRIORITY_PATHS.length;\nconst MAX_SITEMAP_FETCHES = MAX_PAGES;"
          fixed = "// Large sites must not be silently reduced to the number of guessed priority routes.\n// The fetch budget stays bounded, while sitemap and link discovery can again cover\n// complete SaaS and enterprise websites.\nconst MAX_PAGES = 500;\nconst MAX_SITEMAP_FETCHES = 50;"
          if broken not in content:
              raise SystemExit("Expected crawler page-cap regression was not found")
          path.write_text(content.replace(broken, fixed, 1))
          PY

      - name: Add regression assertion
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/lib/ai-engine/crawler/crawlBusinessWebsite.test.ts")
          content = path.read_text()
          marker = 'const page = (title: string, links = "") => `<!doctype html><html><head><title>${title}</title></head><body><main>${"Useful business content. ".repeat(8)}${links}</main></body></html>`;\n'
          test = r'''

test("does not cap sitemap-backed crawls at the priority-path count", async () => {
  const sitemapPages = Array.from({ length: 20 }, (_, index) => `https://example.test/product-${index + 1}`);
  const result = await crawlBusinessWebsite("https://example.test", undefined, {
    assertSafe: async () => undefined,
    fetchSitemap: async (url) => url.pathname === "/sitemap.xml"
      ? { resolvedUrl: url, xml: `<urlset>${sitemapPages.map((location) => `<url><loc>${location}</loc></url>`).join("")}</urlset>` }
      : null,
    fetchPage: async (url) => ({ resolvedUrl: url, html: page(`Product ${url.pathname}`) }),
  });

  assert.ok(result.diagnostics.pagesFetchAttempted > 12);
  assert.ok(result.diagnostics.pagesRetained > 12);
});
'''
          if test.strip() not in content:
              if marker not in content:
                  raise SystemExit("Crawler test insertion point was not found")
              content = content.replace(marker, marker + test, 1)
              path.write_text(content)
          PY

      - name: Run crawler tests
        run: npm run test:ai-builder-crawler

      - name: Commit restored crawler coverage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/ai-engine/crawler/crawlBusinessWebsite.ts app/lib/ai-engine/crawler/crawlBusinessWebsite.test.ts
          git rm .github/workflows/restore-ai-builder-crawler-coverage.yml
          git commit -m "Restore large-site crawler coverage"
          git push
