name: Business Brain Phase 1 Verify

on:
  push:
    branches:
      - feature/business-brain-phase-1
  pull_request:
    branches:
      - main
    paths:
      - "app/lib/ai-engine/deterministic/**"
      - ".github/workflows/business-brain-phase1-verify.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deterministic tests
        run: >-
          node --experimental-transform-types
          --experimental-loader ./test/node-alias-loader.mjs
          --test
          app/lib/ai-engine/deterministic/*.test.ts
          app/lib/ai-engine/deterministic/routing/*.test.ts
          app/lib/ai-engine/deterministic/specialists/*.test.ts
          app/lib/ai-engine/deterministic/legacy/*.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Diff check
        run: git diff --check origin/main...HEAD
