name: Fix crawler syntax

on:
  push:
    branches: [main]
    paths:
      - ".github/restore-crawler-coverage-trigger"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fix crawler syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/lib/ai-engine/crawler/crawlBusinessWebsite.ts')
          text = path.read_text()
          broken = 'const { chromium } = await (loadPlaywright ? loadPlaywright() : import("playwright") as Promise<{ chromium: { launch: (options: { headless: boolean; args?: string[] }) => Promise<PlaywrightBrowser> }>);'
          fixed = 'const { chromium } = await (loadPlaywright ? loadPlaywright() : import("playwright") as Promise<{ chromium: { launch: (options: { headless: boolean; args?: string[] }) => Promise<PlaywrightBrowser> } }>);'
          if broken not in text:
              raise SystemExit('Broken Playwright expression not found')
          path.write_text(text.replace(broken, fixed, 1))
          PY
      - name: Commit fix
        run: |
          rm -f .github/restore-crawler-coverage-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/ai-engine/crawler/crawlBusinessWebsite.ts .github/restore-crawler-coverage-trigger
          git commit -m "Fix crawler Playwright syntax"
          git push
