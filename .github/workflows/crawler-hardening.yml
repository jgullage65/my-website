name: Crawler and public research checks

on:
  pull_request:
    paths:
      - "app/api/ai-builder/crawl/**"
      - "app/api/internal/leadforge/research/**"
      - "app/lib/ai-engine/crawler/**"
      - "app/lib/ai-engine/public-research/**"
      - "app/lib/ai-engine/deterministic/**"
      - "app/lib/ai-engine/knowledge/**"
      - "app/lib/telemetry/ai-builder-telemetry.ts"
      - "app/lib/db/ai-builder-schema.ts"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/crawler-hardening.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crawler-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crawler
          POSTGRES_PASSWORD: crawler
          POSTGRES_DB: crawler_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U crawler -d crawler_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://crawler:crawler@127.0.0.1:5432/crawler_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Public research/API/security tests
        run: npm run test:public-research
      - name: Existing website crawler regressions
        run: npm run test:ai-builder-crawler
      - name: Crawler database integration tests
        run: npm run test:ai-builder-crawler-db
      - name: Production TypeScript check
        run: npm run typecheck
