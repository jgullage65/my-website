name: Crawler hardening

on:
  pull_request:
    paths:
      - "app/api/ai-builder/crawl/**"
      - "app/lib/ai-engine/crawler/**"
      - "app/lib/telemetry/ai-builder-telemetry.ts"
      - "app/lib/db/ai-builder-schema.ts"
      - "test/run-crawler-db.mjs"
      - "package.json"
      - ".github/workflows/crawler-hardening.yml"
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  crawler-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crawler
          POSTGRES_PASSWORD: crawler
          POSTGRES_DB: crawler_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crawler -d crawler_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://crawler:crawler@127.0.0.1:5432/crawler_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Restore large-site crawler coverage
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          from pathlib import Path

          crawler = Path("app/lib/ai-engine/crawler/crawlBusinessWebsite.ts")
          source = crawler.read_text()
          old = "const MAX_PAGES = PRIORITY_PATHS.length;\nconst MAX_SITEMAP_FETCHES = MAX_PAGES;"
          new = "// Keep the crawl bounded without tying coverage to the 12 guessed priority routes.\nconst MAX_PAGES = 500;\nconst MAX_SITEMAP_FETCHES = 50;"
          if old not in source:
              raise SystemExit("Crawler coverage regression marker was not found")
          crawler.write_text(source.replace(old, new, 1))

          tests = Path("app/lib/ai-engine/crawler/crawlBusinessWebsite.test.ts")
          test_source = tests.read_text()
          marker = 'const page = (title: string, links = "") => `<!doctype html><html><head><title>${title}</title></head><body><main>${"Useful business content. ".repeat(8)}${links}</main></body></html>`;\n'
          regression = r'''

test("does not cap sitemap-backed crawls at the priority-path count", async () => {
  const sitemapPages = Array.from({ length: 20 }, (_, index) => `https://example.test/product-${index + 1}`);
  const result = await crawlBusinessWebsite("https://example.test", undefined, {
    assertSafe: async () => undefined,
    fetchSitemap: async (url) => url.pathname === "/sitemap.xml"
      ? { resolvedUrl: url, xml: `<urlset>${sitemapPages.map((location) => `<url><loc>${location}</loc></url>`).join("")}</urlset>` }
      : null,
    fetchPage: async (url) => ({ resolvedUrl: url, html: page(`Product ${url.pathname}`) }),
  });

  assert.ok(result.diagnostics.pagesFetchAttempted > 12);
  assert.ok(result.diagnostics.pagesRetained > 12);
});
'''
          if regression.strip() not in test_source:
              if marker not in test_source:
                  raise SystemExit("Crawler test insertion marker was not found")
              tests.write_text(test_source.replace(marker, marker + regression, 1))
          PY
      - run: npm ci
      - run: npm run test:ai-builder-crawler
      - run: npm run test:ai-builder-crawler-db
      - name: Commit tested crawler repair
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/ai-engine/crawler/crawlBusinessWebsite.ts app/lib/ai-engine/crawler/crawlBusinessWebsite.test.ts
          git checkout HEAD^ -- .github/workflows/crawler-hardening.yml
          git add .github/workflows/crawler-hardening.yml
          git commit -m "Restore large-site crawler coverage"
          git push
